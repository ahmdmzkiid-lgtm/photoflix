<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <!-- Main text -->
  <text x="60" y="35" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" letter-spacing="-0.5">Photoflix</text>
  <!-- Camera icon replacing 'o' -->
  <g transform="translate(28, 18)">
    <rect x="0" y="2" width="18" height="13" rx="2" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="9" cy="9" r="4" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="9" cy="9" r="1.5" fill="#ffffff"/>
    <rect x="4" y="-1" width="10" height="4" rx="1" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="15" y1="0" x2="17" y2="-2" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
    <line x1="17" y1="1" x2="19" y2="1" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
  </g>
  <!-- Subtitle -->
  <text x="72" y="50" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="5" opacity="0.7">PHOTO BOOTH</text>
  <!-- Decorative line -->
  <line x1="143" y1="47" x2="195" y2="47" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
  <circle cx="198" cy="47" r="2" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
</svg>
