<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#041426"/>
  <g transform="translate(16,16)">
    <!-- Camera body -->
    <rect x="-10" y="-6" width="20" height="14" rx="2" fill="none" stroke="#e9c349" stroke-width="1.5"/>
    <!-- Lens -->
    <circle cx="0" cy="1" r="4" fill="none" stroke="#e9c349" stroke-width="1.5"/>
    <circle cx="0" cy="1" r="1.5" fill="#e9c349"/>
    <!-- Flash -->
    <rect x="-4" y="-9" width="8" height="4" rx="1" fill="none" stroke="#e9c349" stroke-width="1.2"/>
    <!-- Flash sparkle -->
    <line x1="6" y1="-8" x2="8" y2="-10" stroke="#e9c349" stroke-width="1" stroke-linecap="round"/>
    <line x1="8" y1="-7" x2="10" y2="-7" stroke="#e9c349" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
